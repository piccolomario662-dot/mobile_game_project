<!DOCTYPE html><html><head><title>Tetris</title><style>body{background:#111;color:#fff;text-align:center;font-family:sans-serif;}canvas{border:2px solid #fff;background:#000;}</style></head><body><h1>Tetris</h1><canvas id="tetris" width="240" height="400"></canvas><script>const canvas=document.getElementById("tetris"),ctx=canvas.getContext("2d");ctx.scale(20,20);const matrix=[[0,0,0],[1,1,1],[0,1,0]];let arena=createMatrix(12,20);function createMatrix(w,h){const matrix=[];while(h--)matrix.push(new Array(w).fill(0));return matrix;}function draw(){ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height);drawMatrix(arena,{x:0,y:0});drawMatrix(matrix,{x:5,y:5});}function drawMatrix(matrix,offset){matrix.forEach((row,y)=>{row.forEach((value,x)=>{if(value!==0){ctx.fillStyle="red";ctx.fillRect(x+offset.x,y+offset.y,1,1);}});});}draw();</script></body></html>
